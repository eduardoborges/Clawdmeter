# Builds every board's firmware on a version tag and attaches one zip per
# board to the GitHub release, for the Mac app's Firmware settings.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install platformio==6.2.0
      - name: Build
        run: |
          for env in waveshare_amoled_216 waveshare_amoled_18 waveshare_amoled_216_c6 waveshare_amoled_18_c6 \
                     waveshare_amoled_206 waveshare_lcd_154 waveshare_lcd_4; do
            pio run -d firmware -e "$env"
          done
      - run: python3 tools/package_firmware.py
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes
