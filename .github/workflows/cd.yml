name: CD

# Builds a published release and attaches Tally.dmg and one firmware zip per
# board, which the Mac app's Firmware tab downloads. The manual dispatch
# rebuilds an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  app:
    runs-on: macos-latest
    timeout-minutes: 30
    environment:
      name: release
      url: https://github.com/eduardoborges/tally/releases/tag/${{ github.event.release.tag_name || inputs.tag }}
    env:
      # Without the signing secrets the build ships ad hoc signed.
      HAVE_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Import signing certificate
        if: env.HAVE_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 -d > cert.p12
          security create-keychain -p ci build.keychain
          # keychains auto-lock after 5 minutes, and a locked keychain hangs codesign forever
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain > /dev/null
          rm cert.p12
      - name: Build and package
        env:
          SIGN_IDENTITY: ${{ env.HAVE_SIGNING == 'true' && 'Developer ID Application' || '' }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: mac/build.sh --dmg
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" mac/build/Tally.dmg --clobber

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One job per board, so they build in parallel and one failing board
    # doesn't hold back the others.
    strategy:
      fail-fast: false
      matrix:
        env: [waveshare_amoled_216, waveshare_amoled_18, waveshare_amoled_216_c6, waveshare_amoled_18_c6,
              waveshare_amoled_206, waveshare_lcd_154, waveshare_lcd_4]
    env:
      # Compiled objects keyed by their inputs, so the Arduino core and LVGL
      # skip the compiler when they haven't changed.
      PLATFORMIO_BUILD_CACHE_DIR: ${{ github.workspace }}/.pio-build-cache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # The platform and toolchains, one cache per chip.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            !~/.platformio/.cache
          key: pio-${{ endsWith(matrix.env, '_c6') && 'c6' || 's3' }}-${{ hashFiles('firmware/platformio.ini') }}
      # Libraries stay at the cached versions until platformio.ini changes.
      - uses: actions/cache@v6
        with:
          path: firmware/.pio/libdeps/${{ matrix.env }}
          key: libdeps-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
      # A new key every run keeps the newest objects; restore-keys picks the latest one.
      - uses: actions/cache@v6
        with:
          path: .pio-build-cache
          key: pio-objects-${{ matrix.env }}-${{ github.run_id }}
          restore-keys: pio-objects-${{ matrix.env }}-
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install platformio==6.2.0
      - run: pio run -d firmware -e ${{ matrix.env }}
      - run: python3 tools/package_firmware.py ${{ matrix.env }}
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.zip --clobber
